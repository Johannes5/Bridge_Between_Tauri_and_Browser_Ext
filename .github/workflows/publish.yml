name: "publish"

on:
  push:
    branches:
      - release
    tags:
      - "v*"

jobs:
  publish-extension:
    name: Publish Extension
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - name: Build
        run: |
          yarn install
          yarn run build:proto
          yarn run build:ext
      - name: Create Extension Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Extension Release ${{ github.ref }}
          body:
          draft: true
          prerelease: false
      - name: Upload & release
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: packages/ext-plasmo/build/chrome-mv3-prod.zip
          asset_name: bridge-extension.zip
          asset_content_type: application/zip

  publish-app:
    name: Build and Publish App
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            patchelf \
            build-essential \
            curl \
            file \
            wget \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            libxdo-dev 

      - name: Install frontend dependencies
        run: yarn install
      - name: Build shared library
        run: yarn run build:proto
      - name: Build and publish sidecar
        run: cargo build --release --manifest-path packages/sidecar/Cargo.toml
      - name: Upload built sidecar artifacts
        uses: actions/upload-artifact@v4
        with:
         name: sidecar-build-${{ matrix.platform }}
         path: packages/sidecar/target/release/bridge-sidecar*

      - name: Build and publish with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          projectPath: './packages/app-tauri'
          tauriScript: 'yarn'
          args: ${{ matrix.args }}

      - name: Upload built app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-${{ matrix.platform }}
          path: packages/app-tauri/src-tauri/target/release/bundle/

  publish-windows-app:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4


    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 25

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
    - name: Install msixbundle-cli
      run: cargo install msixbundle-cli

    - name: Install dependencies
      run: yarn install
    - name: Build shared library
      run: yarn run build:proto
    - name: Build and publish sidecar
      run: cargo build --release --manifest-path packages/sidecar/Cargo.toml
    - name: Upload built sidecar artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sidecar-build-${{ matrix.platform }}
        path: packages/sidecar/target/release/bridge-sidecar*


    - name: Build MSIX bundle
      run: yarn tauri:windows:build --arch x64,arm64 --runner yarn
    - name: Create MSIX Release
      id: create_release_MSIX
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: MSIX Release ${{ github.ref }}
        body: ""
        draft: true
        prerelease: false
    - name: Upload & release
      id: upload-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_name: msix-bundle
        asset_path: packages/app-tauri/src-tauri/target/msix/*.msixbundle
        asset_content_type: application/msix
