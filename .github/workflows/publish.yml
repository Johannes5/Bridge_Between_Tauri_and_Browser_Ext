name: "publish"

on:
  push:
    branches:
      - release
    tags:
      - "v*"

jobs:
  publish-extension:
    name: Publish Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - name: Build
        run: |
          yarn install
          yarn run build:proto
          yarn run build:ext
      - name: Upload & release
        uses: actions/upload-artifact@v4
        with:
          path: 'packages/ext-plasmo/build/chrome-mv3-prod.zip'

  publish-app:
    name: Build and Publish App
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            patchelf \
            build-essential \
            curl \
            file \
            wget \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            libxdo-dev 

      - name: Install frontend dependencies
        run: yarn install
      - name: Build shared library
        run: yarn run build:proto
      - name: Build and publish sidecar
        run: cargo build --release --manifest-path packages/sidecar/Cargo.toml
      - name: Upload built sidecar artifacts
        uses: actions/upload-artifact@v4
        with:
         name: sidecar-build-${{ matrix.platform }}
         path: packages/sidecar/target/release/bridge-sidecar*

      - name: Build and publish with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          projectPath: './packages/app-tauri'
          tauriScript: 'yarn'
          args: ${{ matrix.args }}

      - name: Upload built app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-${{ matrix.platform }}
          path: packages/app-tauri/src-tauri/target/release/bundle/

